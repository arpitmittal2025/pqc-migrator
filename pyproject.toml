[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pqc-migrator"
version = "0.1.0"
description = "AI-driven post-quantum cryptography migration and optimization framework"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "jinja2>=3.1",
    "cryptography>=42.0",
    "kyber-py>=1.0",
    "dilithium-py>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
liboqs = ["liboqs-python>=0.10"]

[project.scripts]
pqc-migrator = "pqc_migrator.cli:main"

[tool.setuptools.packages.find]
include = ["pqc_migrator*"]

[tool.setuptools.package-data]
"pqc_migrator.reporter" = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
